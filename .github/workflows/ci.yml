name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate app, modules & docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install js-yaml (workflow linting)
        run: npm install --no-save js-yaml

      - name: Validate shell, ES-module graph, template registry & README assets
        run: node scripts/validate.js

      - name: Check module sizes
        run: |
          SHELL_SIZE=$(stat -c%s index.html)
          APP_SIZE=$(cat index.html css/*.css js/*.js | wc -c)
          echo "index.html shell is $SHELL_SIZE bytes; app total (html+css+js) is $APP_SIZE bytes"
          if [ "$SHELL_SIZE" -gt 200000 ]; then
            echo "::warning::index.html exceeds 200 KB — app code belongs in js/ and css/"
          fi
          for f in js/*.js; do
            SIZE=$(stat -c%s "$f")
            if [ "$SIZE" -gt 90000 ]; then
              echo "::warning::$f exceeds 90 KB — consider splitting the module"
            fi
          done
